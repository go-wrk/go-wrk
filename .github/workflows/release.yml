name: 构建发布

# 只在打了版本标签时跑，日常提交不触发。
# 标签必须落在 main 上，下面第一步会检查 —— dev 上的临时标签不会发出去。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 发 Release 需要写权限

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 要完整历史才判断得了标签在不在 main 上
          fetch-depth: 0

      - name: 确认标签打在 main 上
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::这个标签不在 main 上，不构建"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Vite 7 要求 20.19+ 或 22.12+
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 版本跟着 go.mod 里引的 Wails 走，升级 Wails 时这里也要改
      - name: 装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # main.go 有 //go:embed all:frontend/dist，而这个目录被 .gitignore 排除、
      # 干净检出里根本没有。不先铺个占位，go test 连编译都过不了
      # （wails build 自己能建，但它排在后面）。
      - name: 跑测试
        shell: bash
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep
          go test ./...

      # wails.json 的 productVersion 是写死的 1.0.0，得把标签版本同步过去，
      # 否则打 v1.2.3 发出来的 exe，属性里还是显示 1.0.0
      - name: 同步版本号
        shell: bash
        run: |
          sed -i "s/\"productVersion\": *\"[^\"]*\"/\"productVersion\": \"${GITHUB_REF_NAME#v}\"/" wails.json
          grep productVersion wails.json

      - name: 构建
        shell: bash
        run: wails build -clean -platform windows/amd64 -ldflags "-X main.version=${GITHUB_REF_NAME#v}"

      # 下载下来的文件名带版本号，几个版本放一起也分得清
      - name: 给产物改名
        shell: bash
        run: cp build/bin/go-wrk-desktop.exe "go-wrk-desktop-${GITHUB_REF_NAME}.exe"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: go-wrk-desktop-${{ github.ref_name }}.exe
          generate_release_notes: true
